 <!DOCTYPE html>
<html>
<head>
    <title>Cadastro de Livros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

   

    
    <form> 
         <h1>Biblioteca Central</h1>
    <p>Cadastrar Novo Livro</p> 
        <label>Código do Livro:</label>
        <input type="number" id="text" name="titulo" placeholder="0000" required>

        <label>Título do Livro:</label>
        <input type="text" id="text" name="titulo" placeholder="Título do Livro" required>


        <label>Autor:</label>
        <input type="text" id="text" name="autor" placeholder="Autor do Livro" required>

        <label>Ano de Publicação:</label>
        <input type="number" id="text" name="ano" placeholder="Ano de Publicação" required>

        <button>Cadastrar</button>
    </form>




</body>
</html>
